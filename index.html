<!doctype html>
<html lang="en">
  <head>
    <script>
      // Runtime Environment: HMR is disabled in this environment. Ignore WebSocket errors.
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isHmr = protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              urlStr.indexOf('token=') !== -1 ||
              urlStr.indexOf('24678') !== -1 ||
              urlStr.indexOf('vite') !== -1;

            if (isHmr) {
              var fakeWs = {
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1,
                send: function() {},
                close: function() {},
                addEventListener: function(evt, handler) {
                  if (evt === 'open') {
                    setTimeout(function() {
                      try { handler(new Event('open')); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onmessage: null,
                onerror: null,
              };
              return fakeWs;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (
            typeof firstArg === 'string' &&
            (firstArg.indexOf('websocket') !== -1 ||
             firstArg.indexOf('WebSocket') !== -1 ||
             firstArg.indexOf('[vite]') !== -1)
          ) {
            console.debug.apply(console, arguments);
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            (String(event.reason).indexOf('[vite]') !== -1 ||
             String(event.reason).indexOf('websocket') !== -1 ||
             String(event.reason).indexOf('WebSocket') !== -1)
          ) {
            event.preventDefault();
          }
        });

        window.addEventListener('error', function(event) {
          if (
            event.message &&
            (String(event.message).indexOf('[vite]') !== -1 ||
             String(event.message).indexOf('websocket') !== -1 ||
             String(event.message).indexOf('WebSocket') !== -1)
          ) {
            event.preventDefault();
          }
        });
      })();
    </script>
